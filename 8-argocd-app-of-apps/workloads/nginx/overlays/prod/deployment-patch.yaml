# partial Deployment — only the fields that differ; lists merge by name
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  template:
    spec:
      containers:
        - name: nginx
          resources:
            limits:
              memory: 128Mi
      volumes:
        - name: content
          hostPath:
            path: /tmp/nginx-demo/prod/site
