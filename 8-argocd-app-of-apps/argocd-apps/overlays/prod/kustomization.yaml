apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -prod              # nginx-demo-prod, whoami-prod

patches:
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: nginx-demo
        namespace: argocd
      spec:
        source:
          path: 8-argocd-app-of-apps/workloads/nginx/overlays/prod
        destination:
          namespace: nginx-prod
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: whoami
        namespace: argocd
      spec:
        source:
          path: 8-argocd-app-of-apps/workloads/whoami/overlays/prod
        destination:
          namespace: whoami-prod
